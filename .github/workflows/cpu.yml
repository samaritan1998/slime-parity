name: CPU correctness
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,hf]'
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
  bf16-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]' 'transformers==4.57.6' safetensors
      - run: python -m pytest -q examples/diagnostics/bf16/tests
        env:
          PYTHONPATH: src:examples/diagnostics/bf16
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
